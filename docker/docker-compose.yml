version: "3.8"

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: studysphere-ai:latest
    container_name: studysphere_app
    restart: unless-stopped
    env_file:
      - ../.env
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - IS_DOCKER=true
    volumes:
      - ../data/uploads:/app/data/uploads
      - ../data/chroma_db:/app/data/chroma_db
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 20s
      timeout: 10s
      retries: 3
      start_period: 15s

  nginx:
    image: nginx:alpine
    container_name: studysphere_nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      app:
        condition: service_healthy
